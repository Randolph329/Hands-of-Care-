<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Profile | Hands of Care</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <nav>
    <a href="index.html">Home</a>
    <a href="directory.html">Directory</a>
    <a href="dashboard.html">Dashboard</a>
    <a href="profile.html">My Profile</a>
    <a href="login.html">Logout</a>
  </nav>

  <main class="container">
    <h1>My Profile</h1>

    <p>Manage your Hands of Care account information.</p>

    <form>
      <label for="fullname">Full Name</label><br>
      <input type="text" id="fullname" name="fullname" placeholder="Enter your full name"><br><br>

      <label for="email">Email Address</label><br>
      <input type="email" id="email" name="email" placeholder="Enter your email"><br><br>

      <label for="phone">Phone Number</label><br>
      <input type="tel" id="phone" name="phone" placeholder="Enter your phone number"><br><br>

      <label for="address">Address</label><br>
      <input type="text" id="address" name="address" placeholder="Enter your address"><br><br>

      <button type="submit">Save Profile</button>
    </form>

    <h2>Account Features</h2>
    <ul>
      <li>View and update your information</li>
      <li>Access saved resources</li>
      <li>Track service requests</li>
      <li>Manage your Hands of Care account</li>
    </ul>

  </main>

</body>
</html>
