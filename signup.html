<!DOCTYPE html>
<html lang="en>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign Up | Hands of Care</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<nav class="navbar">
  <div class="nav-brand">Hands of Care</div>

  <div class="nav-links">
    <a href="index.html">Home</a>
    <a href="directory.html">Resource Directory</a>
    <a href="services.html">Services</a>
    <a href="about.html">About</a>
    <a href="request.html">Request Help</a>
    <a href="dashboard.html">Dashboard</a>
    <a href="profile.html">My Profile</a>
    <a href="login.html">Login</a>
    <a href="signup.html">Sign Up</a>
    <a href="contact.html">Contact</a>
  </div>
</nav>

  <main class="container">
    <h1>Create Your Hands of Care Account</h1>

    <p>Join Hands Care to access trusted resources, connect with services, and receive support.</p>

    <form id="signupForm">
      <label for="fullname">Full Name</label><br>
      <input type="text" id="fullname" name="fullname" placeholder="Enter your full name"><br><br>

      <label for="email">Email</label><br>
      <input type="email" id="email" name="email" placeholder="Enter your email"><br><br>

      <label for="password">Password</label><br>
      <input type="password" id="password" name="password" placeholder="Create a password"><br><br>

      <label for="confirm-password">Confirm Password</label><br>
      <input type="password" id="confirm-password" name="confirm-password" placeholder="Confirm your password"><br><br>

      <button type="submit">Create Account</button>
    </form>

    <p>Already have an account?</p>
    <a href="login.html">Log In</a>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>
  <script src="supabase.js"></script>

  <script>
  const signupForm = document.getElementById("signupForm");

  signupForm.addEventListener("submit", async function(event) {
    event.preventDefault();

    const fullName = document.getElementById("fullname").value;
    const email = document.getElementById("email").value;
    const password = document.getElementById("password").value;

    const { data, error } = await supabaseClient.auth.signUp({
      email: email,
      password: password,
      options: {
        data: {
          full_name: fullName
        }
      }
    });

    if (error) {
      alert("Sign up failed: " + error.message);
    } else {
      alert("Account created successfully! Please check your email to verify your account.");
      window.location.href = "login.html";
    }
  });
</script>

</body>
</html>
