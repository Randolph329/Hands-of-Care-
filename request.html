<body>

<nav class="navbar">
  <div class="nav-brand">Hands of Care</div>

  <div class="nav-links">

  <main class="container">
    <h1>Request Help</h1>

    <p>Tell us what kind of assistance you need. We'll connect you with the right resources.</p>

    <form>
      <label for="name">Full Name</label><br>
      <input type="text" id="name" name="name" placeholder="Enter your full name"><br><br>

      <label for="email">Email</label><br>
      <input type="email" id="email" name="email" placeholder="Enter your email"><br><br>

      <label for="phone">Phone Number</label><br>
      <input type="tel" id="phone" name="phone" placeholder="Enter your phone number"><br><br>

      <label for="service">Service Needed</label><br>
      <select id="service" name="service">
        <option>Transportation</option>
        <option>Home Repairs</option>
        <option>Food Assistance</option>
        <option>Healthcare Resources</option>
        <option>Companionship</option>
        <option>Other</option>
      </select><br><br>

      <label for="details">How can we help?</label><br>
      <textarea id="details" name="details" rows="6" placeholder="Describe what you need..."></textarea><br><br>

      <button type="submit">Submit Request</button>
    </form>

  </main>

</body>
</html>
