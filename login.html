<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login | Hands of Care</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<nav class="navbar">
  <div class="nav-brand">Hands of Care</div>

  <div class="nav-links">
    <a href="index.html">Home</a>
    <a href="directory.html">Resource Directory</a>
    <a href="services.html">Services</a>
    <a href="about.html">About</a>
    <a href="request.html">Request Help</a>
    <a href="dashboard.html">Dashboard</a>
    <a href="profile.html">My Profile</a>
    <a href="login.html">Login</a>
    <a href="signup.html">Sign Up</a>
    <a href="contact.html">Contact</a>
  </div>
</nav>

  <main class="container">
    <h1>Hands of Care Login</h1>

    <p>Welcome back. Please log in to access your Hands of Care account.</p>

    <form id="loginForm">
      <label for="email">Email</label><br>
      <input type="email" id="email" name="email" placeholder="Enter your email"><br><br>

      <label for="password">Password</label><br>
      <input type="password" id="password" name="password" placeholder="Enter your password"><br><br>

      <button type="submit">Login</button>
    </form>

    <p>Don’t have an account yet?</p>
    <a href="signup.html">Create an Account</a>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>
<script src="supabase.js"></script>

  <script>
  const loginForm = document.getElementById("loginForm"); 

  loginForm.addEventListener("submit", async function(event) {
    event.preventDefault();

    const email = document.getElementById("email").value;
    const password = document.getElementById("password").value;

    const { data, error } = await supabaseClient.auth.signInWithPassword({
      email: email,
      password: password
    });

    if (error) {
      alert("Login failed: " + error.message);
    } else {
      alert("Login successful!");
      window.location.href = "dashboard.html";
    }
  });
</script>

</body>
</html>
